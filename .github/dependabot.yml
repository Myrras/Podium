version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["release:patch", "dependencies"]
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels: ["release:patch", "dependencies"]
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: ["release:patch", "dependencies"]
    # typescript-eslint doesn't support TypeScript 7 yet; remove when it does.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
