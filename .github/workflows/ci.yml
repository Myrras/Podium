# Synced from rust-base (sync/files/); don't edit it in the app, the next sync
# overwrites it. Per-app settings go in .github/rust-base.json.
#
# Every push to main (a merged PR) runs CI, including Windows, and then
# releases. Pull requests run frontend and Rust only; Windows on a PR comes
# from ci-windows.yml (the `windows` label). No label event starts this
# workflow: GitHub judges the required `ci / ci-ok` by the latest run of this
# workflow on the head commit, so a label run that skipped `ci` would hide it
# ("Expected — Waiting for status to be reported").
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  # Only a new commit cancels a run (`synchronize` cancels the run of the
  # previous commit), so a cancelled `ci / ci-ok` always belongs to an
  # outdated commit and never blocks the merge.
  group: ci-${{ github.ref }}
  # main: a running run is never cancelled, but a newer push cancels an older
  # pending one. Their merges ship in the next release, which takes the
  # highest release label over all PRs merged since the last tag.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

permissions:
  contents: read

jobs:
  ci:
    uses: Myrras/rust-base/.github/workflows/reusable-tauri-ci.yml@v2

  release:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: Myrras/rust-base/.github/workflows/reusable-release.yml@v2
    permissions:
      contents: write
      pull-requests: read
      actions: write
    secrets:
      # Empty when the repo has no such secret: the release then pushes with
      # GITHUB_TOKEN (see release.require-deploy-key).
      RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
