# Synced from rust-base (sync/files/); don't edit it in the app, the next sync
# overwrites it. Per-app settings go in .github/rust-base.json.
#
# Every push to main (a merged PR) runs CI, including Windows, and then
# releases. Pull requests run Windows only with the `windows` label; adding the
# label starts a CI run with Windows next to the running CI. Any other label
# (e.g. release:patch) starts a run whose `ci` job is skipped: it adds no
# `ci / ci-ok` check. No label event cancels a run.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  # Only a new commit cancels a run, so a cancelled `ci / ci-ok` always belongs
  # to an outdated commit and never blocks the merge. Commit runs (push,
  # opened, synchronize, reopened) share one group per branch; `synchronize`
  # cancels the run of the previous commit. Every label run gets a group of its
  # own: GitHub keeps only the newest pending run per group and cancels older
  # pending ones even without cancel-in-progress, so a shared group (even one
  # per commit) would let a burst of label events cancel a run on the head
  # commit. Adding `windows` therefore runs CI with Windows next to the
  # running CI instead of replacing it.
  group: ci-${{ github.ref }}${{ github.event.action == 'labeled' && format('-run-{0}', github.run_id) || '' }}
  # main: a running run is never cancelled, but a newer push cancels an older
  # pending one. Their merges ship in the next release, which takes the
  # highest release label over all PRs merged since the last tag.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

permissions:
  contents: read

jobs:
  ci:
    # Keep this condition: it is what stops an unrelated label from producing
    # a skipped (= passing) `ci / ci-ok` check.
    if: github.event.action != 'labeled' || github.event.label.name == 'windows'
    uses: Myrras/rust-base/.github/workflows/reusable-tauri-ci.yml@v2

  release:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: Myrras/rust-base/.github/workflows/reusable-release.yml@v2
    permissions:
      contents: write
      pull-requests: read
      actions: write
    secrets:
      # Empty when the repo has no such secret: the release then pushes with
      # GITHUB_TOKEN (see release.require-deploy-key).
      RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
