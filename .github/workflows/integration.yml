# Synced from rust-base (sync/files/); don't edit it in the app, the next sync
# overwrites it. Per-app settings (runner, apt packages, WSL, env, recipe) go
# in the `integration` section of .github/rust-base.json.
#
# Runs `just test-integration` (or the configured recipe) from this repo's
# justfile. Off the per-PR path on purpose: image pulls, WSL and real external
# services make these slow and occasionally flaky. Nightly and on demand.
name: Integration tests

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    uses: RobbieMinderhoud/rust-base/.github/workflows/reusable-integration.yml@v2
    secrets:
      # Exposed to the test step as env INTEGRATION_TOKEN; empty when the repo
      # has no such secret.
      INTEGRATION_TOKEN: ${{ secrets.INTEGRATION_TOKEN }}
