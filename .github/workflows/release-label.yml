# Every PR needs exactly one release label; the `release` job in ci.yml reads
# it on merge. Separate from ci.yml so (un)labeling doesn't re-run the heavy CI.
name: Release label

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]

permissions: {}

jobs:
  label:
    name: Release label
    runs-on: ubuntu-latest
    steps:
      - name: Require exactly one of patch, minor, major
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          count=$(jq '[.[] | select(. == "patch" or . == "minor" or . == "major")] | length' <<< "$LABELS")
          if [ "$count" -ne 1 ]; then
            echo "::error::Set exactly one release label on this PR: patch, minor or major (found $count)."
            exit 1
          fi
