[package]
name = "podium-core"
description = "UI-agnostic core for Podium: process orchestration, PTY management, agent adapters, and the built-in MCP server. Zero Tauri dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# On top of the shared features: `io-std` for the MCP stdio bridge, `process`
# for the assistant's piped headless-CLI child.
tokio = { workspace = true, features = ["io-std", "process"] }
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true
portable-pty = "0.9"
# `podium.yml` project configuration.
serde_yaml_ng = "0.10"
# Shell-safe quoting for agent launch command lines.
shlex = "1"
# Built-in MCP server. rmcp is pinned exactly (API churn); all rmcp usage is
# isolated to `src/mcp/`.
rmcp = { version = "=1.8.0", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
schemars = "1"
# ANSI stripping for `get_process_output` (agents read plain text).
strip-ansi-escapes = "0.2"
# CancellationToken for MCP server shutdown (already in-tree via rmcp).
tokio-util = "0.7"
# HTTP client: the stdio MCP bridge (`mcp/bridge.rs`, localhost plain HTTP) and
# the self-hosted GitLab issues fetch (`issues.rs`, blocking, HTTPS). `rustls`
# verifies against the platform trust store, so an internal CA works.
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "rustls"] }
# OS keychain for the GitLab token (never in a Podium file).
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# Encoding an image attachment read from disk into a `stream-json` content
# block; already a dependency of `src-tauri` for terminal bytes.
base64 = "0.22"
# Shrinking an oversized image attachment before it travels as base64.
# Decode/encode only — no filters beyond the resize, hence the trimmed
# feature set (GIFs are passed through untouched, so no gif codec).
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
] }
# `canonicalize` without Windows' `\\?\` verbatim prefix, which
# `CreateProcessW`'s `lpCurrentDirectory` (portable-pty's `CommandBuilder::cwd`)
# rejects with `ERROR_ACCESS_DENIED`. A plain passthrough on other platforms.
dunce = "1"

# Unix-only: process-group signalling for graceful stop (killpg SIGTERM →
# SIGKILL). Windows kills the ConPTY child via portable-pty's ChildKiller.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal", "process"] }

[dev-dependencies]
tempfile = "3"
# Integration tests call the MCP tools directly (Parameters extractor).
rmcp = { version = "=1.8.0", features = ["server", "macros", "transport-streamable-http-server"] }
