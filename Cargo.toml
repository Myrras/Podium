[workspace]
resolver = "2"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "3.2.6"
edition = "2021"
rust-version = "1.82"
authors = ["Podium contributors"]

[workspace.dependencies]
# Shared across podium-core and the Tauri shell.
serde = { version = "1", features = ["derive"] }
# A JSON file Podium edits in place (Claude Code's config,
# `agent::folder_trust`) is written back as it was: `preserve_order` keeps its
# keys in their order, `float_roundtrip` its floats digit for digit.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.dev]
# Full DWARF debuginfo is the bulk of `target/debug` (it dwarfs the compiled
# code). Line tables keep file:line in panics/backtraces at a fraction of the
# size, with no hit to rebuild speed.
debug = "line-tables-only"

[profile.release]
# ponytail: cargo's defaults (16 codegen units, no cross-crate LTO). Fat LTO +
# codegen-units = 1 shaved ~3.5 MB off the binary but added ~110s to the final,
# single-threaded link on EVERY build (2m18s -> 29s for a one-crate change).
# Not worth it for a desktop app that gets rebuilt many times a day. Re-add
# `lto = true` + `codegen-units = 1` if bundle size ever matters more than
# build time.
strip = true
